<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RdSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <aside class="character-sidebar">
            <div class="sheet-header">
                <h2>Reiter der Schwarzen Sonne</h2>
            </div>

            <div class="attributes-row">
                <div class="attr-box">
                    <div class="attr-title">
                        <img src="icons/sun.png" alt="Sun" class="stat-icon">
                        <span>Stärke</span>
                    </div>
                    <div class="attr-value-container">
                        <span id="stat-strength" class="attr-main-val">5</span>
                    </div>
                </div>
                <div class="attr-box">
                    <div class="attr-title">
                        <img src="icons/moon.png" alt="Moon" class="stat-icon">
                        <span>Geschick</span>
                    </div>
                    <div class="attr-value-container">
                        <span id="stat-agility" class="attr-main-val">5</span>
                    </div>
                </div>
            </div>

            <div class="combat-stats-row">
                <div class="combat-box">
                    <img src="icons/bolt.png" alt="Attack" class="stat-icon">
                    <label>Angriff:</label>
                    <span id="stat-attack">5</span>
                </div>
                <div class="combat-box">
                    <img src="icons/shield.png" alt="Defense" class="stat-icon">
                    <label>Verteidigung:</label>
                    <span id="stat-armour">5</span>
                </div>
            </div>

            <hr class="sheet-divider">

            <div class="vitality-section">
                <div class="attr-title">
                    <img src="icons/heart.png" alt="Vitality" class="stat-icon">
                    <span>Vitalität</span>
                </div>
                <div class="health-steps">
                    <div class="health-step" id="hp-6">fit</div>
                    <div class="health-step" id="hp-5">normal</div>
                    <div class="health-step" id="hp-4">angeschl.</div>
                    <div class="health-step" id="hp-3">verletzt</div>
                    <div class="health-step" id="hp-2">kritisch</div>
                    <div class="health-step death" id="hp-1"><img src="icons/skull.png" alt="Tot"></div>
                </div>
            </div>

            <div class="inventory-section">
                <h3>Waffen & Utensilien</h3>
                <div class="item-slot">
                    <span class="slot-label">Aktiv:</span>
                    <span id="active-weapon" class="slot-content">Keine</span>
                </div>
                <ul id="inventory-list" class="sheet-list">
                    <li>Keine Gegenstände</li>
                </ul>
            </div>
        </aside>

        <main class="story-area">
            <div class="manuscript-panel">
                <header class="section-header">
                    <span id="section-id">Sektion 0</span>
                    <span id="progression-text">Fortschritt: 0%</span>
                </header>

                <article class="text-display" id="story-text">
                    Willkommen To The 'Reiter der Schwarzen Sonne'!
                </article>

                <footer class="controls" id="action-buttons">
                    <button class="btn-action" onclick="nextSection()">Kapitel lesen</button>
                </footer>
            </div>
        </main>
    </div>

</body>
</html>
